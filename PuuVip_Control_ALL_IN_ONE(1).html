<style>
*{box-sizing:border-box}
body{margin:0;background:#0b0b0f;color:#f5f5f7;font-family:-apple-system,BlinkMacSystemFont,"SF Pro Display","Helvetica Neue",sans-serif}
.wrap{max-width:900px;margin:auto;padding:48px 40px 70px}
h1{font-size:48px;line-height:1.05;margin:0;font-weight:800;letter-spacing:-1.5px}
.sub{font-size:25px;color:#9b9ba3;margin:18px 0 46px}
.card{background:#18181e;border:1px solid #2b2b32;border-radius:30px;padding:12px 42px;margin-bottom:28px}
.row{min-height:125px;display:flex;align-items:center;justify-content:space-between;gap:24px;border-bottom:1px solid #303037}
.row:last-child{border-bottom:0}
.name{font-size:27px;font-weight:750}
.desc{font-size:20px;color:#9b9ba3;margin-top:10px}
.switch{width:82px;height:50px;border:0;border-radius:28px;background:#3b3b45;padding:3px;position:relative;cursor:pointer}
.knob{display:block;width:44px;height:44px;background:#fff;border-radius:50%;transition:.18s;box-shadow:0 2px 6px #0005}
.switch.on{background:#1683ff}
.switch.on .knob{transform:translateX(32px)}
.statusTitle{font-size:27px;font-weight:750}
.badge{display:inline-block;margin:20px 0 8px;background:#222229;color:#bfc0c8;padding:13px 20px;border-radius:20px;font-size:19px}
.note{font-size:17px;color:#888891;line-height:1.55}
@media(max-width:600px){
.wrap{padding:30px 20px 50px}
h1{font-size:34px}
.sub{font-size:20px;margin-bottom:28px}
.card{padding:8px 22px;border-radius:24px}
.row{min-height:105px}
.name{font-size:21px}
.desc{font-size:15px}
.switch{width:62px;height:38px}
.knob{width:32px;height:32px}
.switch.on .knob{transform:translateX(24px)}
.statusTitle{font-size:22px}
.note{font-size:14px}
}
</style>
</head>
<body>
<main class="wrap">
<h1>PuuVip Control</h1>
<div class="sub">Bảng điều khiển chế độ</div>

<section class="card">
  <div class="row">
    <div><div class="name">Fix lố bám đầu</div><div class="desc">Bật/tắt chế độ</div></div>
    <button class="switch" data-name="Fix lố bám đầu"><span class="knob"></span></button>
  </div>
  <div class="row">
    <div><div class="name">Tăng nhạy</div><div class="desc">Bật/tắt chế độ</div></div>
    <button class="switch" data-name="Tăng nhạy"><span class="knob"></span></button>
  </div>
  <div class="row">
    <div><div class="name">Fix rung</div><div class="desc">Bật/tắt chế độ</div></div>
    <button class="switch" data-name="Fix rung"><span class="knob"></span></button>
  </div>
</section>

<section class="card">
  <div class="statusTitle">Trạng thái</div>
  <div class="badge" id="status">Chưa bật chế độ</div>
</section>

<div class="note">Các công tắc lưu trạng thái trên thiết bị. Đây là giao diện WebClip/web app và không thay đổi trực tiếp thông số hay cơ chế của game.</div>
</main>

<script>
const switches=[...document.querySelectorAll(".switch")];
const status=document.getElementById("status");
const KEY="puuvip-control-v1";

function render(){
  const states=switches.map(s=>s.classList.contains("on"));
  try{localStorage.setItem(KEY,JSON.stringify(states));}catch(e){}
  const active=switches.filter(s=>s.classList.contains("on")).length;
  status.textContent=active ? `${active} chế độ đang bật` : "Chưa bật chế độ";
}

try{
  const states=JSON.parse(localStorage.getItem(KEY)||"[]");
  states.forEach((v,i)=>{if(v && switches[i]) switches[i].classList.add("on");});
}catch(e){}

switches.forEach(s=>s.addEventListener("click",()=>{
  s.classList.toggle("on");
  render();
}));
render();
</script>
</body>
</html>
